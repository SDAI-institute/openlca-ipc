name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package with dev + test dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests (mocked suite, live tests excluded)
        run: pytest
        # live tests require a running openLCA desktop; they run locally only.

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install linting dependencies
        run: uv pip install --system flake8 black

      - name: Check formatting (black)
        run: black --check openlca_ipc/ tests/

      - name: Lint (flake8)
        run: flake8 openlca_ipc/ --max-line-length=100 --extend-ignore=E501,W503
